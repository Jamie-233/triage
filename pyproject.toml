[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "An AI agent that troubleshoots network problems the way an engineer would: forms hypotheses, runs real diagnostics, and reports evidence — with an offline playbook when no model is available."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie" }]
dependencies = [
    "aiohttp>=3.9",
    "dnspython>=2.6",
    "icmplib>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
